[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coding-agent-dev-template"
version = "0.1.0"
description = "Agent-ready Python project template."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
coding-agent-dev-template = "coding_agent_dev_template.cli:main"

[dependency-groups]
dev = [
  "hatchling>=1.27",
  "pre-commit>=4.3",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "pyright>=1.1.400",
  "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent_dev_template"]

[tool.ruff]
extend-exclude = [".uv-cache", ".uv-python"]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PTH",
  "PT",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=coding_agent_dev_template",
  "--cov-report=term-missing",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["coding_agent_dev_template"]

[tool.coverage.report]
show_missing = true
skip_covered = true
